name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/nova.jks
      - run: gradle assembleDebug --no-daemon
        env:
          KS_FILE: ${{ runner.temp }}/nova.jks
          KS_PASS: ${{ secrets.KS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: NovaKeyboard-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NovaKeyboard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NovaKeyboard.apk --title "Nova Keyboard" --notes "Debug APK"
